<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apps</title>
  <link href="assets/images/branding/favicon/favicon.png" rel="icon" type="image/x-icon" />
  <link href="assets/css/settings/main.css" rel="stylesheet" />
  <link href="assets/css/nav.css" rel="stylesheet" />
  <link href="assets/css/apps.css" rel="stylesheet" />
  <link href="resources/css/main.css" rel="stylesheet" />
  <script src="./uv/uv.bundle.js"></script>
  <script src="./uv/uv.config.js"></script>
  <script src="resources/js/go.js"></script>
  <script src="resources/js/visit.js"></script>
    <script src="resources/js/popularity.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="/assets/js/themecontrol.js"></script>
</head>

<body>
  <header class="header2">
    <a href="/" class="logo">Interstellar</a>
    <nav class="header2-right">
      <a href="photography">Proxy</a>
      <a href="blank">Blank</a>
      <a href="mathematics">Games</a>
      <a href="ocean" class="active">Apps</a>
      <a href="forest">Chatroom</a>
      <a href="settings">Settings</a>
    </nav>
  </header>

  <main class="apps-page">
    <label class="apps-search" for="searchbar">Search apps</label>
    <input class="searchbar" id="searchbar" name="search" placeholder="Search apps" type="search" />
    <section id="app-list" class="app-list" aria-live="polite"></section>
    <p style="margin: 28px 0 16px; color: #aaa; font-size: 13px;">Some pages may take a little longer to load.</p>
  </main>

  <script>
    const apps = [
      {
        name: "Bing",
        url: "https://bing.com",
        icon: "https://images-eds-ssl.xboxlive.com/image?url=4rt9.lXDC4H_93laV1_eHM0OYfiFeMI2p9MWie0CvL99U4GA1gf6_kayTt_kBblFwHwo8BW8JXlqfnYxKPmmBeRogmRf1xieDJbrjYvc.hUvqidNQtgZY7VtoCuVM31yHuXAFled7S57y0AM6xx1XMCHawJ_zIRORv7SCOGYUFs-&format=source",
        open: "direct",
      },
      {
        name: "Discord",
        url: "https://discord.com/login",
        icon: "/images/discord.ico",
        open: "direct",
      },
    ];
    const appList = document.getElementById("app-list");
    const searchbar = document.getElementById("searchbar");

    function renderApps(filter = "") {
      const query = filter.trim().toLowerCase();
      const visibleApps = apps.filter((app) => app.name.toLowerCase().includes(query));

      appList.replaceChildren();
      visibleApps.forEach((app) => {
        const card = document.createElement("article");
        card.className = "card app-card";
        card.innerHTML = `
          <button type="button" class="app-button" aria-label="Open ${app.name}">
            <img loading="lazy" src="${app.icon}" alt="" onerror="this.src='/assets/images/icons/apps/discord.jpg'" />
            <span>${app.name}</span>
          </button>
        `;
        card.querySelector("button").addEventListener("click", () => {
          window.popularItemName = app.name;
          window.popularItemCategory = "App";
          (app.open === "direct" ? visit : go)(app.url);
        });
        appList.appendChild(card);
      });
    }

    searchbar.addEventListener("input", () => renderApps(searchbar.value));
    renderApps();
  </script>
</body>

</html>
