    const appList = document.getElementById("app-list");
    const searchbar = document.getElementById("searchbar");

    function renderApps(filter = "") {
      const query = filter.trim().toLowerCase();
      const visibleApps = apps.filter((app) => app.name.toLowerCase().includes(query));

      appList.replaceChildren();
      visibleApps.forEach((app) => {
        const card = document.createElement("article");
        card.className = "card app-card";
        card.innerHTML = `
          <button type="button" class="app-button" aria-label="Open ${app.name}">
            <img loading="lazy" src="${app.icon}" alt="" onerror="this.src='/assets/images/icons/apps/discord.jpg'" />
            <span>${app.name}</span>
          </button>
        `;
        card.querySelector("button").addEventListener("click", () => {
          if (app.alert) {
            alert(app.alert);
            return;
          }
          window.popularItemName = app.name;
          window.popularItemCategory = "App";
          go(app.url);
        });
        appList.appendChild(card);
      });
    }

    searchbar.addEventListener("input", () => renderApps(searchbar.value));
    renderApps();
